name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the code with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # NDK 27.0.12077973 is the default NDK of the Android Gradle Plugin this project uses.
      - name: Install NDK and CMake
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: sidestep-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
